[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p4"
version = "0.0.1"
description = "P4 research artifact: post-revocation payment disposition (synthetic simulator)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]
stripe = [
    "stripe",
]

[tool.setuptools.packages.find]
include = ["p4*", "checker*", "experiments*", "analysis*"]

[tool.pytest.ini_options]
# research_code/test_lab.py is run through unittest by tests/legacy, not collected directly.
testpaths = ["tests", "agent/tests"]
# importlib mode: test files in different directories may share a basename
# (tests/ dirs have no __init__.py). Shared helpers come from tests/helpers via tests/conftest.py.
addopts = ["--import-mode=importlib"]
xfail_strict = true
markers = [
    "slow: long-running tests",
    "stripe: live Stripe test mode; runs only with STRIPE_TEST_KEY and --run-stripe (or P4_RUN_STRIPE=1)",
]

[tool.ruff]
# Legacy pilot is frozen; audit scripts are kept byte-for-byte as reproduced in CODE_AUDIT.md.
extend-exclude = ["research_code", "scripts/audit_*.py"]
